name: CodeQL

# Static security analysis by GitHub. Free for public repositories.
# Runs only when app code changes, so a fresh copy of the template (no code yet) doesn't fail.
# Add more folders to `paths` if your code lives elsewhere.

on:
  push:
    branches: [main]
    paths: ["src/**", "app/**", "lib/**", "server/**", "api/**", "components/**", "pages/**"]
  pull_request:
    branches: [main]
    paths: ["src/**", "app/**", "lib/**", "server/**", "api/**", "components/**", "pages/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          # Change or add languages to match your stack, e.g. python, java-kotlin, go
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
