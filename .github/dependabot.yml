# Dependabot: opens PRs to update vulnerable or outdated dependencies.
# Also turn on Dependabot alerts: Settings → Code security.

version: 2
updates:
  # Keeps the GitHub Actions used in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

